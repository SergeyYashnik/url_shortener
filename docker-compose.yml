services:
    nginx:
        image: nginx:alpine
        container_name: url_shortener_nginx
        restart: unless-stopped
        ports:
            - "${DOCKER_APP_PORT:-8080}:80"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - ./:/var/www/html
        depends_on:
            - backend
        networks:
            - app_network

    backend:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: url_shortener_backend
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
        env_file:
            - .env
        depends_on:
            - db
        networks:
            - app_network

    db:
        image: postgres:17-alpine
        container_name: url_shortener_db
        restart: unless-stopped
        shm_size: 1g
        volumes:
            - pg_data:/var/lib/postgresql/data
        env_file:
            - .env
        environment:
            POSTGRES_DB: ${DB_DATABASE:-laravel}
            POSTGRES_USER: ${DB_USERNAME:-laravel}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "${DOCKER_DB_PORT:-5432}:5432"
        networks:
            - app_network

networks:
    app_network:
        driver: bridge

volumes:
    pg_data:
